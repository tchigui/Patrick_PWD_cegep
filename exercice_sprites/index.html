<!DOCTYPE html>
 <html lang="fr">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Exercice – Sprites CSS</title>
 <!-- Normalizer (facultatif, on le garde comme dans votre exemple) -->
 <link rel="stylesheet" href="node_modules/normalize.css/normalize.css" />
 <link rel="stylesheet" href="css/styles.css" />
 </head>
 <body>
 <section>
 <h1>Exercice – Sprites CSS</h1>
 <!-- Sprite principal -->
 <div id="eskimo" class="sprite"></div>
 <!-- Deuxième sprite (même sheet, autre zone) -->
 <div id="penguin" class="sprite"></div>
 <!-- Bouton « activer/désactiver le hover » (facultatif) -->
 <button id="toggleHover">Désactiver le hover</button>
 </section>
 <script>
 // Petit script qui active/désactive le hover en ajoutant ou retirant la classe .no-hover
 const btn = document.getElementById('toggleHover');
 const sprites = document.querySelectorAll('.sprite');
 btn.addEventListener('click', () => {
 sprites.forEach(el => el.classList.toggle('no-hover'));
 btn.textContent = btn.textContent.includes('Désactiver')
 ? 'Activer le hover'
 : 'Désactiver le hover';
 });
 </script>
 </body>
 </html>
