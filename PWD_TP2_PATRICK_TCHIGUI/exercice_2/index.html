<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP2 – Exercice 2 : Calculateur de traînée</title>

  <!-- Bootstrap CSS depuis node_modules (on remonte d'un dossier) -->
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

  <!-- Ton CSS spécifique ex2 si tu veux -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="p-4">

  <div class="container">
    <h1 class="h3 mb-4">Exercice 2 – Calculateur de coefficient de traînée (CD)</h1>

    <div class="row">
      <!-- Colonne gauche : Définition des forces -->
      <div class="col-md-6 mb-4">
        <h2 class="h5">Définition des forces</h2>
        <div id="definitionForces" class="mt-3 border rounded p-3 bg-light">
          <!-- Le contenu de definition_forces.php sera inséré ici -->
        </div>
      </div>

      <!-- Colonne droite : Formulaire + Résultat -->
      <div class="col-md-6 mb-4">
        <h2 class="h5">Calculateur de CD</h2>

        <form id="formCD" class="mt-3">
          <div class="mb-3">
            <label for="inputFlap" class="form-label">Angle des volets (Flap)</label>
            <select id="inputFlap" class="form-select">
              <option value="0">0°</option>
              <option value="20">20°</option>
              <option value="45">45°</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="inputMach" class="form-label">Nombre de Mach (M)</label>
            <input id="inputMach" type="number" step="0.01" min="0" max="0.85" class="form-control">
            <div class="form-text">0 ≤ M ≤ 0,85</div>
          </div>

          <div class="mb-3">
            <label for="inputCl" class="form-label">Coefficient de portance (Cl)</label>
            <input id="inputCl" type="number" step="0.01" min="0.2" max="1.2" class="form-control">
            <div class="form-text">0,2 ≤ Cl ≤ 1,2</div>
          </div>

          <button id="btnCalculer" type="submit" class="btn btn-primary">
            Calculer CD
          </button>
        </form>

        <div id="zoneMessage" class="mt-3"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de l'exercice 2 -->
  <script src="js/exercice_2.js"></script>
</body>
</html>
